<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cesium CFD 风场流体仿真 Demo</title>
    <link
      href="https://unpkg.com/cesium/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="toolbar">
      <h1>CFD 风场流体仿真 Demo</h1>
      <div class="controls">
        <label>
          粒子数
          <input id="particleCount" type="range" min="500" max="12000" value="4500" step="100" />
          <span id="particleCountValue">4500</span>
        </label>
        <label>
          粒子速度
          <input id="speedFactor" type="range" min="0.1" max="3" value="1" step="0.1" />
          <span id="speedFactorValue">1.0x</span>
        </label>
        <label>
          尾迹长度
          <input id="trailFade" type="range" min="0.01" max="0.2" value="0.06" step="0.01" />
          <span id="trailFadeValue">0.06</span>
        </label>
      </div>
      <p>模拟数据：在中国近海区域构造旋涡 + 高空急流的二维风场，并将粒子按速度场进行平流。</p>
    </div>

    <div id="cesiumContainer"></div>
    <canvas id="windCanvas"></canvas>

    <script src="https://unpkg.com/cesium/Build/Cesium/Cesium.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
